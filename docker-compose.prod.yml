# Quill — production self-host smoke test.
#
# Builds and runs the SAME deployment-agnostic images that ship to EKS, wired to
# a local Postgres — the "does the whole thing come up on any Docker host?"
# check. This is what an OSS adopter self-hosting Quill would run; it proves the
# images are not EKS-specific.
#
#   docker compose -f docker-compose.prod.yml up --build
#   # → http://localhost:3000 (web)   http://localhost:4000/health (api)
#
# `docker-compose.yml` (the other file) is the zero-app dev-Postgres helper for
# `pnpm dev:pg`. THIS file runs the built API + web images end-to-end.
#
# Migrations run once via the `migrate` one-shot service before the API starts
# (mirrors the gated release step in deploy/DEPLOY-INTERNAL.md — never baked
# into the long-running pod, so scaling never races migrators).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quill}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-quill}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER:-quill}" -d "$${POSTGRES_DB:-quill}"']
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - quill-prod-pgdata:/var/lib/postgresql/data

  # One-shot: run DB migrations, then exit. Uses the API image (it carries
  # @quill/db + the migrations).
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # The api image is a PRUNED single-package bundle (no monorepo root, so no
    # root `db:migrate` script). Run the @quill/db migrate CLI via the tsx JS
    # entrypoint EXACTLY like the API's CMD: the distroless image has no shell,
    # so its node entrypoint cannot exec the node_modules/.bin/tsx shell shim —
    # only a .mjs/.js file. (--tsconfig mirrors the CMD; the dev tsconfig's
    # extends chain doesn't resolve inside the pruned bundle.)
    command:
      [
        'node_modules/tsx/dist/cli.mjs',
        '--tsconfig',
        'tsconfig.runtime.json',
        'node_modules/@quill/db/src/cli/migrate.ts',
      ]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  # One-shot: apply the operator's IDENTITY_USERS_JSON user manifest to the
  # identity tables, then exit. Runs AFTER migrate so the tables exist. This is
  # how a DISTROLESS deploy provisions its team without any shell: the api
  # image carries no terminal (Coolify's "terminal" can exec nothing there).
  # Idempotent: existing emails are skipped unless an entry says
  # `"reset": true`; blank/unset manifest = "nothing to do", exit 0.
  identity-seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command:
      [
        'node_modules/tsx/dist/cli.mjs',
        '--tsconfig',
        'tsconfig.runtime.json',
        'src/cli/identity-seed.ts',
      ]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      IDENTITY_USERS_JSON: ${IDENTITY_USERS_JSON:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      # The committed build ships two auth providers: `local` (an
      # unauthenticated DEV STUB) and `workos` (needs the private overlay).
      # The API deliberately REFUSES the stub under NODE_ENV=production, so
      # this smoke-test stack runs NODE_ENV=development by default — override
      # both vars together for a real deployment with a real provider:
      #   NODE_ENV=production AUTH_PROVIDER=workos (+ its JWT_SECRET etc.)
      NODE_ENV: ${NODE_ENV:-development}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
      API_PORT: '4000'
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      # Trusted web origin: OAuth redirects AND the default CORS allowlist entry
      # (cors.ts refuses to reflect arbitrary origins; without this only
      # http://localhost:3000 is allowed).
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      # Optional additional browser origins, comma-separated (public web hosts
      # the API doesn't live behind).
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # The web/API sit behind ONE reverse proxy (Coolify's Traefik): 1 hop.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      # --- First-party identity (AUTH_PROVIDER=password) ------------------------
      # PUBLIC_APP_URL below doubles as the ONLY host a login returnTo may
      # leave for. IDENTITY_PUBLIC_URL is /iam-suffixed this API's public
      # self-address (the web's IAM_BASE_URL equals it); IDENTITY_ACCOUNT_ID is
      # the workspace the JIT provisions everyone's membership under.
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ISSUER: ${JWT_ISSUER:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      IDENTITY_PUBLIC_URL: ${IDENTITY_PUBLIC_URL:-}
      IDENTITY_ACCOUNT_ID: ${IDENTITY_ACCOUNT_ID:-}
      IDENTITY_ACCESS_TTL_S: ${IDENTITY_ACCESS_TTL_S:-}
      IDENTITY_REFRESH_TTL_DAYS: ${IDENTITY_REFRESH_TTL_DAYS:-}
      IDENTITY_REFRESH_GRACE_S: ${IDENTITY_REFRESH_GRACE_S:-}
      # Community-safe default: no external email, no Dapta coupling.
      EMAIL_PROVIDER: log-only
      # Optional spam protection (Cloudflare Turnstile): set BOTH to let form
      # owners turn on a human check before the final submit. Unset = off.
      # CAPTCHA_SITE_KEY: ${CAPTCHA_SITE_KEY:-}
      # CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY:-}
    ports:
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # INLINED AT BUILD TIME into the client bundle (see the web Dockerfile):
        # must be the address the BROWSER reaches the API at. Default matches the
        # docker-host smoke test; a real deploy sets it in the .env / Coolify
        # variables, e.g. NEXT_PUBLIC_API_URL=https://forms-api.domain.com.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    environment:
      NODE_ENV: production
      PORT: '3060'
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      # Server-only callers (RSC fetches, server actions) — runtime, and may use
      # the INTERNAL Compose address so traffic never leaves the Docker network.
      # The web speaks the UPSTREAM provider names ('local' | 'workos'): a
      # first-party password identity on the API is, from the web's seat, the
      # 'workos' provider (login hand-off to IAM_BASE_URL). So Coolify sets
      # AUTH_PROVIDER=password on the API and WEB_AUTH_PROVIDER=workos here.
      AUTH_PROVIDER: ${WEB_AUTH_PROVIDER:-}
      # The login delegate: <IDENTITY_PUBLIC_URL>/iam in production. The web
      # redirects /login through it (workos provider) and calls /iam/auth/*
      # for refresh/logout. For AUTH_PROVIDER=password that is THIS compose's
      # own id. Server-only; never exposed.
      IAM_BASE_URL: ${IAM_BASE_URL:-}
      API_URL: ${API_URL:-http://api:4000}
      # Trusted web origin: OAuth redirects and post-login returns (never read
      # from Host/X-Forwarded-Host).
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      WEB_SESSION_SECRET: ${WEB_SESSION_SECRET:-}
    ports:
      - '3060:3060'
    depends_on:
      - api

volumes:
  quill-prod-pgdata:
